
name: NovaMerch Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Merch/Merch/Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Merch/Merch/Backend/pom.xml

      
      - name: Generate test-only JWT keys
        run: |
          mkdir -p target/test-keys
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out target/test-keys/private.pem
          openssl pkey \
            -in target/test-keys/private.pem \
            -pubout \
            -out target/test-keys/public.pem

      - name: Run backend tests
        env:
          JWT_PRIVATE_KEY: file:target/test-keys/private.pem
          JWT_PUBLIC_KEY: file:target/test-keys/public.pem
        run: mvn -B verify

